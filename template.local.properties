# Copy to local.properties and replace these example paths.
# Keep local.properties untracked. Do not enable takrepo.url for this offline setup.
sdk.dir=/absolute/path/to/Android/sdk
sdk.path=/absolute/path/to/ATAK-CIV-5.5.0.7-SDK
takdev.plugin=/absolute/path/to/ATAK-CIV-5.5.0.7-SDK/atak-gradle-takdev.jar

# The SDK directory must contain main.jar and android_keystore.
# Signing credentials are provided through environment variables (see README).
# Optional machine-specific JDK path belongs in ~/.gradle/gradle.properties:
# org.gradle.java.home=/absolute/path/to/jdk
